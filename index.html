<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بصيرة</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بصيرة">
<meta name="theme-color" content="#050810">
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
:root{--bg:#050810;--card:#111827;--accent:#38bdf8;--accent2:#818cf8;--green:#34d399;--orange:#fb923c;--red:#f87171;--text:#f1f5f9;--muted:#64748b;--border:rgba(255,255,255,0.07)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;user-select:none}
.screen{display:none;width:100%;height:100dvh;flex-direction:column;align-items:center}
.screen.active{display:flex}

/* WELCOME */
#welcome{background:radial-gradient(ellipse 80% 60% at 50% -10%,#1e3a5f 0%,var(--bg) 70%);justify-content:space-between;padding:48px 24px 40px;text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px}
.eyes-container{display:flex;gap:16px;align-items:center;justify-content:center;animation:breathe 3s ease-in-out infinite}
.eye-icon{width:60px;height:38px;display:flex;align-items:center;justify-content:center}
.eye-shape{width:60px;height:38px;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle,rgba(56,189,248,0.08) 0%,transparent 70%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(56,189,248,0.25)}
.eye-pupil{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7dd3fc,#0369a1);box-shadow:0 0 8px rgba(56,189,248,0.6);position:relative;animation:blink-pupil 4s ease-in-out infinite}
.eye-pupil::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px}
.eye-lid{position:absolute;top:0;left:0;right:0;height:0;background:var(--bg);border-radius:50%;animation:blink-lid 4s ease-in-out infinite}
@keyframes blink-lid{0%,40%,60%,100%{height:0}50%{height:100%}}
@keyframes blink-pupil{0%,40%,60%,100%{transform:scaleY(1)}50%{transform:scaleY(0.05)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.brand h1{font-size:40px;font-weight:900;letter-spacing:-1px}
.brand h1 em{color:var(--accent);font-style:normal}
.brand p{color:var(--muted);font-size:13px;line-height:1.7;max-width:260px}

.lang-row{display:flex;gap:10px;width:100%}
.lang-btn{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;transition:all 0.2s}
.lang-btn.on{border-color:var(--accent);background:rgba(56,189,248,0.1);color:var(--accent)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mode-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px 12px;cursor:pointer;text-align:center;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.mode-card.on{border-color:var(--accent);background:rgba(56,189,248,0.08)}
.mode-card .icon{font-size:28px}
.mode-card .mtitle{font-size:13px;font-weight:700;color:var(--text)}
.mode-card .mdesc{font-size:10px;color:var(--muted);line-height:1.4}
.mode-card.on .mtitle{color:var(--accent)}

.go-btn{width:100%;padding:18px;background:linear-gradient(135deg,var(--accent2) 0%,var(--accent) 100%);border:none;border-radius:20px;color:#fff;font-family:'Tajawal',sans-serif;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 8px 32px rgba(56,189,248,0.3);transition:all 0.2s}
.go-btn:active{transform:scale(0.97)}

/* CAMERA SCREEN */
#camScreen{background:#000;position:relative;justify-content:flex-start}
video#cam{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
canvas#cap{display:none}
.grad-top{position:absolute;top:0;left:0;right:0;height:130px;background:linear-gradient(to bottom,rgba(5,8,16,0.95) 0%,transparent 100%);z-index:2;pointer-events:none}
.grad-bot{position:absolute;bottom:0;left:0;right:0;height:220px;background:linear-gradient(to top,rgba(5,8,16,0.99) 0%,transparent 100%);z-index:2;pointer-events:none}
.cam-top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px}
.back-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mode-badge{background:rgba(56,189,248,0.15);backdrop-filter:blur(8px);border:1px solid rgba(56,189,248,0.3);border-radius:20px;padding:7px 14px;font-size:12px;color:var(--accent);font-weight:700}
.switch-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Capture button */
.cam-bottom{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:0 24px 36px;display:flex;flex-direction:column;align-items:center;gap:14px}
.capture-btn{width:80px;height:80px;border-radius:50%;background:#fff;border:4px solid rgba(56,189,248,0.5);box-shadow:0 0 30px rgba(56,189,248,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:32px;transition:all 0.15s;position:relative}
.capture-btn:active{transform:scale(0.9)}
.capture-btn.loading{background:var(--accent);animation:pulse-btn 0.8s ease-in-out infinite}
@keyframes pulse-btn{0%,100%{box-shadow:0 0 30px rgba(56,189,248,0.4)}50%{box-shadow:0 0 50px rgba(56,189,248,0.8)}}
.hint-text{color:var(--muted);font-size:13px;text-align:center}

/* RESULT SCREEN */
#resultScreen{background:var(--bg);justify-content:flex-start;padding:0;overflow-y:auto}
.result-header{width:100%;padding:50px 20px 16px;display:flex;align-items:center;gap:12px;background:var(--bg);position:sticky;top:0;z-index:5}
.result-img{width:100%;max-height:260px;object-fit:cover}
.result-body{width:100%;padding:16px 20px 40px;display:flex;flex-direction:column;gap:16px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.result-card h3{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.result-card p{font-size:15px;line-height:1.7;color:var(--text)}
.speak-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;border-radius:16px;color:#fff;font-family:'Tajawal',sans-serif;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.speak-btn:active{transform:scale(0.97)}
.speak-btn.speaking{background:linear-gradient(135deg,var(--green),#0891b2)}
.action-row{display:flex;gap:10px}
.action-btn{flex:1;padding:13px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.action-btn:active{transform:scale(0.96)}

/* Loading overlay */
.loading-overlay{position:fixed;inset:0;background:rgba(5,8,16,0.92);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.loading-overlay.show{display:flex}
.loader-eye{font-size:60px;animation:breathe 1s ease-in-out infinite}
.loader-text{color:var(--accent);font-size:16px;font-weight:700}
.loader-sub{color:var(--muted);font-size:13px}

.section-label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:right;width:100%}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <div class="brand">
    <div class="eyes-container">
      <div class="eye-icon"><div class="eye-shape"><div class="eye-pupil"></div><div class="eye-lid"></div></div></div>
      <div class="eye-icon"><div class="eye-shape"><div class="eye-pupil"></div><div class="eye-lid"></div></div></div>
    </div>
    <h1>بَ<em>صي</em>رة</h1>
    <p>التق صورة واحدة — أعطيك كل المعلومات بصوت فوري</p>
  </div>

  <div style="width:100%;display:flex;flex-direction:column;gap:14px">
    <div class="section-label">اللغة</div>
    <div class="lang-row">
      <button class="lang-btn on" onclick="pickLang(this,'ar','ar-SA')">🇸🇦 عربية</button>
      <button class="lang-btn" onclick="pickLang(this,'en','en-US')">🇺🇸 English</button>
    </div>

    <div class="section-label">وضع التحليل</div>
    <div class="modes">
      <div class="mode-card on" onclick="pickMode(this,'all')" id="modeAll">
        <div class="icon">🔍</div>
        <div class="mtitle">تحليل شامل</div>
        <div class="mdesc">كل شيء + ترجمة</div>
      </div>
      <div class="mode-card" onclick="pickMode(this,'product')" id="modeProduct">
        <div class="icon">📦</div>
        <div class="mtitle">منتجات</div>
        <div class="mdesc">مواصفات + سعر تقريبي</div>
      </div>
      <div class="mode-card" onclick="pickMode(this,'text')" id="modeText">
        <div class="icon">📄</div>
        <div class="mtitle">قراءة نصوص</div>
        <div class="mdesc">وثائق + فواتير</div>
      </div>
      <div class="mode-card" onclick="pickMode(this,'place')" id="modePlace">
        <div class="icon">🗺️</div>
        <div class="mtitle">أشخاص وأماكن</div>
        <div class="mdesc">تعرف على المحيط</div>
      </div>
    </div>
  </div>

  <button class="go-btn" onclick="openCamera()">افتح الكاميرا 📷</button>
</div>

<!-- CAMERA -->
<div id="camScreen" class="screen">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="cap"></canvas>
  <div class="grad-top"></div>
  <div class="grad-bot"></div>
  <div class="cam-top">
    <button class="back-btn" onclick="closeCamera()">←</button>
    <div class="mode-badge" id="modeBadge">🔍 تحليل شامل</div>
    <button class="switch-btn" onclick="switchCam()">🔄</button>
  </div>
  <div class="cam-bottom">
    <div class="hint-text" id="hintText">اضغط لالتقاط صورة وتحليلها</div>
    <button class="capture-btn" id="captureBtn" onclick="capture()">📷</button>
  </div>
</div>

<!-- RESULT -->
<div id="resultScreen" class="screen">
  <div class="result-header">
    <button class="back-btn" onclick="backToCamera()">←</button>
    <span style="font-weight:700;font-size:16px" id="resultTitle">نتيجة التحليل</span>
  </div>
  <img id="resultImg" class="result-img" src="" alt="">
  <div class="result-body">
    <button class="speak-btn" id="speakBtn" onclick="toggleSpeak()">🔊 استمع للنتيجة</button>
    <div id="resultCards"></div>
    <div class="action-row">
      <button class="action-btn" onclick="backToCamera()">📷 صورة جديدة</button>
      <button class="action-btn" onclick="goHome()">🏠 الرئيسية</button>
    </div>
  </div>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="loader-eye">👁️</div>
  <div class="loader-text" id="loadingText">جاري التحليل...</div>
  <div class="loader-sub" id="loadingSub">بصيرة تفحص الصورة</div>
</div>

<script>

const S = {
  lang:'ar', voiceLang:'ar-SA',

{
  "summary": "نوع الوثيقة أو النص",
  "details": "النص الكامل كما هو مكتوب",
  "text_found": "النص الأصلي بدون تعديل",
  "translation": "ترجمة كاملة للعربية",
  "extra": "ملاحظات مهمة عن المستند"
}`,
    text:`أنت خبير قراءة وثائق ونصوص. اقرأ وحلل كل النصوص في هذه الصورة بدقة عالية وأجب بالعربية بهذا التنسيق JSON بالضبط بدون أي نص خارجه:
{
  "summary": "نوع الوثيقة أو النص: فاتورة، عقد، وصفة طبية، لافتة، كتاب، إلخ",

  "extra": "تحليل الوثيقة: الجهة المصدرة، التاريخ، الأرقام المهمة، التحذيرات، الملاحظات الجوهرية"
}`,

{
  "summary": "ما تراه بإيجاز: شخص، مبنى، طبيعة، شارع، إلخ",

{

}`,

  "translation": "Complete accurate Arabic translation of all foreign text on the product",
  "extra": "Approximate price in Arab and global markets, product pros and cons, similar alternatives in the same price range, usage and maintenance tips, overall rating out of 10"
}`,
    text:`You are a document and text reading expert. Read and analyze all text in this image with high accuracy and respond in English with exactly this JSON format with no text outside it:
{
  "summary": "Document or text type: invoice, contract, prescription, sign, book, etc",
  "details": "Complete text organized as it appears in image preserving formatting",
  "text_found": "Original text verbatim in all its languages without modification",
  "translation": "Professional complete Arabic translation of all text",
  "extra": "Document analysis: issuing authority, date, important numbers, warnings, key notes"
}`,
    place:`You are a geography and recognition expert. Analyze this image and respond in English with exactly this JSON format with no text outside it:
{
  "summary": "What you see briefly: person, building, nature, street, etc",
  "details": "Detailed precise description: clothing and appearance for people, or architectural style and location for places, or nature and climate for landscapes",
  "text_found": "All signs, writing, and visible names in the image",
  "translation": "Arabic translation of all visible text",
  "extra": "Historical, geographical, or cultural information about the place, or general context of the image"
}`
  }
};

function pickLang(btn, lang, vl){
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  S.lang=lang; S.voiceLang=vl;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
}

function pickMode(el, mode){
  document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  S.mode=mode;
}

async function openCamera(){
  show('camScreen');
  document.getElementById('modeBadge').textContent = MODE_INFO[S.mode][S.lang];
  document.getElementById('hintText').textContent = S.lang==='ar'?'اضغط لالتقاط صورة وتحليلها':'Tap to capture and analyze';
  await startCam();
}

function closeCamera(){
  stopCam();
  show('welcome');
}

function goHome(){
  stopCam();
  show('welcome');
}

function backToCamera(){
  show('camScreen');
  if(!S.stream) startCam();
}

async function startCam(){
  try{
    if(S.stream) S.stream.getTracks().forEach(t=>t.stop());
    S.stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:S.camFacing, width:{ideal:1280}, height:{ideal:720}},
      audio:false
    });
    document.getElementById('cam').srcObject=S.stream;
  }catch(e){
    alert(S.lang==='ar'?'لا يمكن الوصول للكاميرا':'Cannot access camera');
  }
}

function stopCam(){
  if(S.stream){S.stream.getTracks().forEach(t=>t.stop()); S.stream=null;}
}

async function switchCam(){
  S.camFacing = S.camFacing==='environment'?'user':'environment';
  await startCam();
}

async function capture(){
  const btn = document.getElementById('captureBtn');
  btn.classList.add('loading');
  btn.textContent='⏳';

  const video = document.getElementById('cam');
  const canvas = document.getElementById('cap');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video,0,0);
  const imgData = canvas.toDataURL('image/jpeg', 0.8);
  const b64 = imgData.split(',')[1];

  showLoading();
  btn.classList.remove('loading');
  btn.textContent='📷';

  await analyze(b64, imgData);
}

function showLoading(){
  const texts = {
    ar:['جاري التحليل...','بصيرة تفحص الصورة'],
    en:['Analyzing...','Baseera is examining the image']
  };
  document.getElementById('loadingText').textContent = texts[S.lang][0];
  document.getElementById('loadingSub').textContent = texts[S.lang][1];
  document.getElementById('loading').classList.add('show');
}

function hideLoading(){
  document.getElementById('loading').classList.remove('show');
}

async function analyze(b64, imgData){
  try{
    const prompt = PROMPTS[S.lang][S.mode];
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          contents:[{parts:[
            {inline_data:{mime_type:'image/jpeg', data:b64}},
            {text:prompt}
          ]}],
          generationConfig:{maxOutputTokens:1500, temperature:0.2}
        })
      }
    );

    const data = await res.json();

    // التحقق من وجود خطأ في الرد
    if(data.error){
      hideLoading();
      showError(S.lang==='ar'?'خطأ في المفتاح أو الاتصال: '+data.error.message:'API Error: '+data.error.message);
      return;
    }

    let txt = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    txt = txt.replace(/```json\n?|```\n?/g,'').trim();

    // إذا لم يأتِ JSON نعرض النص مباشرة
    let result;
    try{
      result = JSON.parse(txt);
    }catch(e){
      result = {
        summary: S.lang==='ar'?'نتيجة التحليل':'Analysis Result',
        details: txt,
        text_found: null,
        translation: null,
        extra: null
      };
    }

    hideLoading();
    showResult(result, imgData);

  }catch(e){
    hideLoading();
    showError(S.lang==='ar'?'تحقق من اتصال الإنترنت وحاول مرة أخرى':'Check your internet connection and try again');
  }
}

function showError(msg){
  show('resultScreen');
  document.getElementById('resultImg').src='';
  document.getElementById('resultImg').style.display='none';
  document.getElementById('resultCards').innerHTML=`
    <div class="result-card" style="border-color:rgba(248,113,113,0.3)">
      <h3 style="color:var(--red)">⚠️ خطأ</h3>
      <p>${msg}</p>
    </div>`;
  S.fullText='';
}

function showResult(data, imgData){
  stopCam();
  document.getElementById('resultImg').src = imgData;
  document.getElementById('resultImg').style.display='block';
  document.getElementById('resultTitle').textContent = S.lang==='ar'?'نتيجة التحليل':'Analysis Result';

  const labels = {
    ar:{summary:'📋 ملخص', details:'🔍 تفاصيل', text_found:'📝 النص الأصلي', translation:'🌐 ترجمة', extra:'💡 معلومات إضافية'},
    en:{summary:'📋 Summary', details:'🔍 Details', text_found:'📝 Text Found', translation:'🌐 Translation', extra:'💡 Extra Info'}
  };

  let html = '';
  let fullText = '';

  for(const [key, label] of Object.entries(labels[S.lang])){
    const val = data[key];
    if(val && val !== 'null' && val !== null && val !== '' && val !== 'N/A'){
      html += `<div class="result-card"><h3>${label}</h3><p>${val}</p></div>`;
      fullText += val + '. ';
    }
  }

  // إذا كانت النتيجة فارغة
  if(!html){
    html = `<div class="result-card"><h3>📋 النتيجة</h3><p>${JSON.stringify(data)}</p></div>`;
    fullText = JSON.stringify(data);
  }

  document.getElementById('resultCards').innerHTML = html;
  S.fullText = fullText;

  show('resultScreen');
  // لا تشغيل تلقائي — المستخدم يضغط الزر
  updateSpeakBtn(false);
}

function toggleSpeak(){
  if(S.speaking){
    window.speechSynthesis.cancel();
    S.speaking=false;
    updateSpeakBtn(false);
  }else{
    speakText(S.fullText);
  }
}

function speakText(txt){
  if(!txt || txt.trim()==='') return;
  window.speechSynthesis.cancel();

  // تقسيم النص لأجزاء أصغر لتجنب مشاكل المتصفح
  const chunks = txt.match(/.{1,200}/g) || [txt];
  let i = 0;

  function speakChunk(){
    if(i >= chunks.length){
      S.speaking=false;
      updateSpeakBtn(false);
      return;
    }
    const u = new SpeechSynthesisUtterance(chunks[i]);
    u.lang=S.voiceLang; u.rate=0.95; u.pitch=1; u.volume=1;
    u.onend=()=>{ i++; speakChunk(); };
    u.onerror=()=>{ S.speaking=false; updateSpeakBtn(false); };
    window.speechSynthesis.speak(u);
    i++;
  }

  S.speaking=true;
  updateSpeakBtn(true);
  speakChunk();
}

function updateSpeakBtn(speaking){
  const btn=document.getElementById('speakBtn');
  if(speaking){
    btn.textContent = S.lang==='ar'?'⏹️ إيقاف الصوت':'⏹️ Stop';
    btn.classList.add('speaking');
  }else{
    btn.textContent = S.lang==='ar'?'🔊 استمع للنتيجة':'🔊 Listen';
    btn.classList.remove('speaking');
  }
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
