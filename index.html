<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بصيرة</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بصيرة">
<meta name="theme-color" content="#050810">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
:root{--bg:#050810;--card:#111827;--accent:#38bdf8;--accent2:#818cf8;--green:#34d399;--orange:#fb923c;--red:#f87171;--text:#f1f5f9;--muted:#64748b;--border:rgba(255,255,255,0.07)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;user-select:none}
.screen{display:none;width:100%;height:100dvh;flex-direction:column}
.screen.active{display:flex}
#welcome{background:radial-gradient(ellipse 80% 60% at 50% -10%,#1e3a5f 0%,var(--bg) 70%);align-items:center;justify-content:space-between;padding:50px 28px 44px;text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:16px}
.eyes-container{display:flex;gap:18px;align-items:center;justify-content:center;animation:breathe 3s ease-in-out infinite}
.eye-icon{width:64px;height:40px;position:relative;display:flex;align-items:center;justify-content:center}
.eye-shape{width:64px;height:40px;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle,rgba(56,189,248,0.08) 0%,transparent 70%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(56,189,248,0.25)}
.eye-pupil{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7dd3fc,#0369a1);box-shadow:0 0 8px rgba(56,189,248,0.6);position:relative;animation:blink-pupil 4s ease-in-out infinite}
.eye-pupil::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;position:absolute;top:3px;left:4px}
.eye-lid{position:absolute;top:0;left:0;right:0;height:0;background:var(--bg);border-radius:50%;animation:blink-lid 4s ease-in-out infinite}
@keyframes blink-lid{0%,40%,60%,100%{height:0}50%{height:100%}}
@keyframes blink-pupil{0%,40%,60%,100%{transform:scaleY(1)}50%{transform:scaleY(0.05)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:0.85}}
.brand h1{font-size:42px;font-weight:900;letter-spacing:-1px;color:var(--text)}
.brand h1 em{color:var(--accent);font-style:normal}
.brand p{color:var(--muted);font-size:14px;line-height:1.7;max-width:280px}
.section-label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;text-align:right}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.lang-btn{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all 0.2s;color:var(--text);display:flex;align-items:center;gap:10px}
.lang-btn .flag{font-size:24px}
.lang-btn .lname{font-size:15px;font-family:'Tajawal',sans-serif;font-weight:700}
.lang-btn .ldesc{font-size:11px;color:var(--muted);font-family:'Tajawal',sans-serif}
.lang-btn.on{border-color:var(--accent);background:rgba(56,189,248,0.1)}
.lang-btn.on .lname{color:var(--accent)}
.go-btn{width:100%;padding:18px;background:linear-gradient(135deg,var(--accent2) 0%,var(--accent) 100%);border:none;border-radius:20px;color:#fff;font-family:'Tajawal',sans-serif;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 8px 32px rgba(56,189,248,0.3);transition:all 0.2s}
.go-btn:active{transform:scale(0.97)}
#app{position:relative;background:#000}
video#cam{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
canvas#cap{display:none}
.grad-top{position:absolute;top:0;left:0;right:0;height:140px;background:linear-gradient(to bottom,rgba(5,8,16,0.9) 0%,transparent 100%);z-index:2;pointer-events:none}
.grad-bot{position:absolute;bottom:0;left:0;right:0;height:260px;background:linear-gradient(to top,rgba(5,8,16,0.98) 0%,transparent 100%);z-index:2;pointer-events:none}
.topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:18px 16px 0}
.back-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mode-badge{background:rgba(52,211,153,0.15);backdrop-filter:blur(8px);border:1px solid rgba(52,211,153,0.3);border-radius:20px;padding:7px 12px;font-size:12px;color:var(--green);font-weight:700;display:flex;align-items:center;gap:5px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.cur-lang-badge{background:rgba(56,189,248,0.1);backdrop-filter:blur(8px);border:1px solid rgba(56,189,248,0.25);border-radius:20px;padding:7px 12px;font-size:12px;color:var(--accent);font-weight:700}
.speech-bubble{position:absolute;bottom:250px;left:14px;right:14px;z-index:10;background:rgba(13,17,23,0.9);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:14px 16px;min-height:65px;display:flex;align-items:center;gap:10px;transform:translateY(8px);opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1)}
.speech-bubble.show{opacity:1;transform:translateY(0)}
.speak-icon{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.3);display:flex;align-items:center;justify-content:center;font-size:15px}
.speak-icon.talking{animation:pulse-icon 0.8s ease-in-out infinite}
@keyframes pulse-icon{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,0.4)}50%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
#ai-text{font-size:15px;line-height:1.6;color:var(--text);flex:1}
.waves{position:absolute;bottom:222px;left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:flex-end;z-index:10;opacity:0;transition:opacity 0.3s}
.waves.active{opacity:1}
.w{width:3px;background:var(--accent);border-radius:2px}
.w:nth-child(1){height:8px;animation:wv 0.7s ease-in-out infinite 0s}
.w:nth-child(2){height:16px;animation:wv 0.7s ease-in-out infinite 0.1s}
.w:nth-child(3){height:24px;animation:wv 0.7s ease-in-out infinite 0.2s}
.w:nth-child(4){height:16px;animation:wv 0.7s ease-in-out infinite 0.3s}
.w:nth-child(5){height:8px;animation:wv 0.7s ease-in-out infinite 0.4s}
@keyframes wv{0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)}}
.bottom-panel{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:0 16px 28px;display:flex;flex-direction:column;gap:10px}
.nav-bar{background:rgba(17,24,39,0.9);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:8px}
.nav-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;direction:rtl}
.nav-bar input::placeholder{color:var(--muted)}
.nav-go{background:var(--accent);border:none;border-radius:10px;padding:9px 14px;color:#000;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
.controls{display:flex;align-items:center;justify-content:center;gap:18px}
.ctrl{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.08);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.ctrl:active{transform:scale(0.9)}
.main-ctrl{width:68px;height:68px;border-radius:50%;font-size:24px;background:linear-gradient(135deg,#1d4ed8,var(--accent));border:3px solid rgba(255,255,255,0.2);box-shadow:0 0 28px rgba(56,189,248,0.35);position:relative}
.main-ctrl.running{background:linear-gradient(135deg,var(--red),#f97316);box-shadow:0 0 28px rgba(248,113,113,0.4)}
.main-ctrl.running::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(248,113,113,0.3);animation:spin 2s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.status-row{display:flex;gap:7px;justify-content:center}
.chip{background:rgba(17,24,39,0.8);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:20px;padding:5px 11px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.chip.ok{border-color:rgba(52,211,153,0.3);color:var(--green)}
.chip.warn{border-color:rgba(251,146,60,0.3);color:var(--orange)}
.conn-status{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(13,17,23,0.8);border:1px solid var(--border);border-radius:12px;padding:6px 14px;font-size:12px;color:var(--muted);display:none}
.conn-status.show{display:block}
</style>
</head>
<body>

<div id="welcome" class="screen active">
  <div class="brand">
    <div class="eyes-container">
      <div class="eye-icon"><div class="eye-shape"><div class="eye-pupil"></div><div class="eye-lid"></div></div></div>
      <div class="eye-icon"><div class="eye-shape"><div class="eye-pupil"></div><div class="eye-lid"></div></div></div>
    </div>
    <h1>بَ<em>صي</em>رة</h1>
    <p>مرشدك الذكي — يرى العالم ويوجّهك بصوت حي فوري</p>
  </div>
  <div style="width:100%">
    <div class="section-label">اختر لغتك / Choose Language</div>
    <div class="langs">
      <button class="lang-btn on" onclick="pickLang(this,'ar','ar-SA','🇸🇦')">
        <span class="flag">🇸🇦</span>
        <div><div class="lname">عربية</div><div class="ldesc">Arabic</div></div>
      </button>
      <button class="lang-btn" onclick="pickLang(this,'en','en-US','🇺🇸')">
        <span class="flag">🇺🇸</span>
        <div><div class="lname">English</div><div class="ldesc">الإنجليزية</div></div>
      </button>
    </div>
  </div>
  <button class="go-btn" onclick="launch()">ابدأ الإرشاد الفوري ⚡</button>
</div>

<div id="app" class="screen">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="cap"></canvas>
  <div class="grad-top"></div>
  <div class="grad-bot"></div>
  <div class="topbar">
    <button class="back-btn" onclick="exitApp()">←</button>
    <div class="mode-badge"><div class="dot-live"></div><span id="liveLabel">مباشر</span></div>
    <div class="cur-lang-badge" id="langBadge">🇸🇦 AR</div>
  </div>
  <div class="conn-status" id="connStatus">جاري الاتصال...</div>
  <div class="speech-bubble show" id="bubble">
    <div class="speak-icon" id="speakIcon">🗣️</div>
    <div id="ai-text">في انتظار التحليل...</div>
  </div>
  <div class="waves" id="waves">
    <div class="w"></div><div class="w"></div><div class="w"></div>
    <div class="w"></div><div class="w"></div>
  </div>
  <div class="bottom-panel">
    <div class="nav-bar">
      <input type="text" id="destInput" placeholder="🗺️ أدخل وجهتك..." />
      <button class="nav-go" onclick="openMaps()">🧭 <span id="navLabel">انطلق</span></button>
    </div>
    <div class="status-row">
      <div class="chip ok" id="chipCam">📷 كاميرا</div>
      <div class="chip" id="chipGPS">📍 GPS</div>
      <div class="chip" id="chipAI">⚡ Live</div>
    </div>
    <div class="controls">
      <button class="ctrl" id="voiceBtn" onclick="toggleVoice()">🔊</button>
      <button class="ctrl main-ctrl" id="mainBtn" onclick="toggleGuide()">▶️</button>
      <button class="ctrl" onclick="switchCam()">🔄</button>
    </div>
  </div>
</div>

<script>
// ضع مفتاح Gemini هنا
const GEMINI_KEY = "YOUR_GEMINI_KEY";
const MODEL = "gemini-2.0-flash-live-001";
const WS_URL = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${GEMINI_KEY}`;

const S = {
  lang:'ar', voiceLang:'ar-SA', flag:'🇸🇦',
  voiceOn:true, running:false,
  camFacing:'environment', stream:null,
  gps:null, ws:null, frameTimer:null,
  connected:false
};

const SYSTEM = {
  ar:`أنت مرشد ذكي للمكفوفين. تستقبل صور من كاميرا مستمرة. صف ما تراه في جملة واحدة قصيرة جداً بالعربية فقط. مثل: "أمامك شخص" أو "طريق مفتوح" أو "درج انتبه" أو "سيارة على اليمين". لا تكرر نفسك إلا إذا تغير المشهد. بدون emoji. جملة واحدة فقط.`,
  en:`You are a smart guide for blind people. You receive frames from a live camera. Describe what you see in ONE very short sentence in English only. Like: "Person ahead" or "Clear path" or "Steps careful" or "Car on right". Don't repeat unless scene changes. No emoji. One sentence only.`
};

function pickLang(btn,lang,vl,flag){
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  S.lang=lang; S.voiceLang=vl; S.flag=flag;
}

async function launch(){
  show('app');
  document.getElementById('liveLabel').textContent = S.lang==='ar'?'مباشر':'LIVE';
  document.getElementById('navLabel').textContent = S.lang==='ar'?'انطلق':'Go';
  document.getElementById('langBadge').textContent = S.flag+' '+S.lang.toUpperCase();
  document.getElementById('ai-text').textContent = S.lang==='ar'?'جاري الاتصال...':'Connecting...';
  document.getElementById('destInput').placeholder = S.lang==='ar'?'🗺️ أدخل وجهتك...':'🗺️ Enter destination...';
  document.documentElement.dir = S.lang==='ar'?'rtl':'ltr';
  await startCam();
  startGPS();
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function startCam(){
  try{
    if(S.stream) S.stream.getTracks().forEach(t=>t.stop());
    S.stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:S.camFacing,width:{ideal:320},height:{ideal:240}},
      audio:false
    });
    document.getElementById('cam').srcObject=S.stream;
    setChip('chipCam',true);
  }catch(e){setChip('chipCam',false);}
}

async function switchCam(){
  S.camFacing = S.camFacing==='environment'?'user':'environment';
  await startCam();
}

function startGPS(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(
    pos=>{S.gps=pos.coords;setChip('chipGPS',true);},
    ()=>setChip('chipGPS',false),
    {enableHighAccuracy:true}
  );
}

function toggleGuide(){S.running?stopGuide():startGuide();}

function startGuide(){
  S.running=true;
  const btn=document.getElementById('mainBtn');
  btn.textContent='⏹️'; btn.classList.add('running');
  connectWS();
}

function stopGuide(){
  S.running=false;
  clearInterval(S.frameTimer);
  if(S.ws){S.ws.close();S.ws=null;}
  S.connected=false;
  const btn=document.getElementById('mainBtn');
  btn.textContent='▶️'; btn.classList.remove('running');
  window.speechSynthesis.cancel();
  document.getElementById('waves').classList.remove('active');
  document.getElementById('speakIcon').classList.remove('talking');
  setChip('chipAI',false);
}

// ====== Gemini Live WebSocket ======
function connectWS(){
  showStatus(S.lang==='ar'?'جاري الاتصال...':'Connecting...');
  setChip('chipAI',null);

  S.ws = new WebSocket(WS_URL);

  S.ws.onopen = ()=>{
    // إرسال إعدادات الجلسة
    S.ws.send(JSON.stringify({
      setup:{
        model: `models/${MODEL}`,
        generation_config:{
          response_modalities:["TEXT"],
          temperature:0.1,
          max_output_tokens:50
        },
        system_instruction:{
          parts:[{text: SYSTEM[S.lang]}]
        }
      }
    }));
  };

  S.ws.onmessage = (event)=>{
    try{
      const data = JSON.parse(event.data);

      // جلسة جاهزة
      if(data.setupComplete){
        S.connected=true;
        hideStatus();
        setChip('chipAI',true);
        document.getElementById('ai-text').textContent = S.lang==='ar'?'الكاميرا تعمل...':'Camera active...';
        // ابدأ إرسال الصور كل ثانية
        startFrameLoop();
      }

      // استقبال النص
      if(data.serverContent?.modelTurn?.parts){
        const parts = data.serverContent.modelTurn.parts;
        for(const part of parts){
          if(part.text && part.text.trim().length>2){
            const txt = part.text.trim();
            showText(txt);
            if(S.voiceOn) speak(txt);
          }
        }
      }
    }catch(e){}
  };

  S.ws.onerror = ()=>{
    setChip('chipAI',false);
    showStatus(S.lang==='ar'?'خطأ في الاتصال':'Connection error');
  };

  S.ws.onclose = ()=>{
    S.connected=false;
    clearInterval(S.frameTimer);
    if(S.running){
      // إعادة الاتصال تلقائياً بعد 2 ثانية
      setTimeout(()=>{if(S.running)connectWS();},2000);
    }
  };
}

function startFrameLoop(){
  clearInterval(S.frameTimer);
  // إرسال صورة كل ثانية
  S.frameTimer = setInterval(()=>{
    if(!S.connected||!S.running)return;
    sendFrame();
  },1000);
}

function sendFrame(){
  try{
    const video=document.getElementById('cam');
    const canvas=document.getElementById('cap');
    if(!video.videoWidth)return;
    canvas.width=256; canvas.height=192;
    canvas.getContext('2d').drawImage(video,0,0,256,192);
    const b64=canvas.toDataURL('image/jpeg',0.3).split(',')[1];

    S.ws.send(JSON.stringify({
      realtime_input:{
        media_chunks:[{
          mime_type:'image/jpeg',
          data:b64
        }]
      }
    }));
  }catch(e){}
}

function showText(txt){
  document.getElementById('ai-text').textContent=txt;
  document.getElementById('bubble').classList.add('show');
}

function speak(txt){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=S.voiceLang; u.rate=1.15; u.pitch=1;
  const icon=document.getElementById('speakIcon');
  const waves=document.getElementById('waves');
  icon.classList.add('talking');
  waves.classList.add('active');
  u.onend=u.onerror=()=>{
    icon.classList.remove('talking');
    waves.classList.remove('active');
  };
  window.speechSynthesis.speak(u);
}

function toggleVoice(){
  S.voiceOn=!S.voiceOn;
  document.getElementById('voiceBtn').textContent=S.voiceOn?'🔊':'🔇';
  if(!S.voiceOn)window.speechSynthesis.cancel();
}

function openMaps(){
  const dest=document.getElementById('destInput').value.trim();
  if(!dest)return;
  const url=S.gps
    ?`https://www.google.com/maps/dir/${S.gps.latitude},${S.gps.longitude}/${encodeURIComponent(dest)}`
    :`https://www.google.com/maps/search/${encodeURIComponent(dest)}`;
  window.open(url,'_blank');
}

function setChip(id,ok){
  const c=document.getElementById(id);
  c.className='chip'+(ok===true?' ok':ok===false?' warn':'');
}

function showStatus(msg){
  const el=document.getElementById('connStatus');
  el.textContent=msg; el.classList.add('show');
}
function hideStatus(){
  document.getElementById('connStatus').classList.remove('show');
}

function exitApp(){
  stopGuide();
  if(S.stream)S.stream.getTracks().forEach(t=>t.stop());
  S.stream=null; S.gps=null;
  window.speechSynthesis.cancel();
  show('welcome');
}

// تسجيل Service Worker للـ PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
